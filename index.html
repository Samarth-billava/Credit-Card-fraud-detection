<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credit Card Fraud Detection</title>
    <script>
        function submitForm(event) {
            event.preventDefault();
            const formData = new FormData(document.getElementById("fraudForm"));
            fetch("/predict", {
                method: "POST",
                body: formData
            })
            .then(response => response.text())
            .then(html => {
                document.open();
                document.write(html);
                document.close();
            });
        }
    </script>
</head>
<body style="
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(45deg, #1a1a2e, #16213e, #0f3460);
    background-size: 400% 400%;
    animation: gradientBG 10s ease infinite;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
">
    <style>
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            width: 350px;
            box-shadow: 0px 0px 15px rgba(0, 255, 255, 0.5);
            backdrop-filter: blur(10px);
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .container:hover {
            transform: scale(1.05);
        }
        h2 {
            color: #fff;
            text-shadow: 0px 0px 10px rgba(0, 255, 255, 0.8);
        }
        form {
            display: flex;
            flex-direction: column;
        }
        input {
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            outline: none;
            text-align: center;
            transition: 0.3s;
        }
        input:focus {
            background: rgba(255, 255, 255, 0.3);
            box-shadow: 0px 0px 10px rgba(0, 255, 255, 0.7);
        }
        button {
            padding: 12px;
            background: #00ffff;
            color: #000;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: bold;
            box-shadow: 0px 0px 10px rgba(0, 255, 255, 0.7);
        }
        button:hover {
            background: #00d4ff;
            box-shadow: 0px 0px 20px rgba(0, 255, 255, 1);
        }
    </style>

    <div class="container">
        <h2>Credit Card Fraud Detection</h2>
        <form id="fraudForm" onsubmit="submitForm(event)">
            <input type="text" name="feature1" placeholder="Feature 1" required>
            <input type="text" name="feature2" placeholder="Feature 2" required>
            <input type="text" name="featureN" placeholder="Feature N" required>
            <button type="submit">Predict</button>
        </form>
    </div>
</body>
</html>
